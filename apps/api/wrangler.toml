name = "lockbox-api"
main = "src/index.ts"
compatibility_date = "2026-01-01"
compatibility_flags = ["nodejs_compat"]

[secrets]
required = ["TOTP_ENCRYPTION_KEY"]

[vars]
CORS_ORIGINS = "https://authwell.app,https://www.authwell.app,https://vault.authwell.app,https://lockbox-web.pages.dev,http://localhost:5173,http://localhost:3000,https://localhost"
EXTENSION_IDS = ""
REGISTRATION_ENABLED = "true"

# api.authwell.app is attached as a one-time Cloudflare custom domain. Keeping
# route management out of CI lets the deploy token update Worker code without
# requiring account-wide Workers Routes permissions.

[[d1_databases]]
binding = "DB"
database_name = "lockbox-vault"
database_id = "a62712d1-c9c6-4ebe-a805-fb6f1e69cb4a"
migrations_dir = "drizzle"

# Preserve the Durable Object migration history even though real-time sync is
# not shipped in v1. Cloudflare requires an explicit deletion migration before
# the previously deployed class can be removed from the Worker bundle.
[[migrations]]
tag = "v1"
new_classes = ["VaultSyncHub"]

[[migrations]]
tag = "v2"
deleted_classes = ["VaultSyncHub"]

[[ratelimits]]
name = "AUTH_LIMITER"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 5
  period = 60


[triggers]
crons = ["0 2 * * *"]

[[r2_buckets]]
binding = "ATTACHMENTS"
bucket_name = "lockbox-attachments"
