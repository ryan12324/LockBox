name: Deploy Web Vault

on:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'packages/**'
      - 'bun.lock'
  workflow_dispatch:

concurrency:
  group: deploy-web
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read
      deployments: write

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.10'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate API URL
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: |
          case "$VITE_API_URL" in
            https://*) ;;
            *) echo "Set the VITE_API_URL repository variable to the deployed HTTPS API URL."; exit 1 ;;
          esac

      - name: Build
        run: bun run build
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}

      - name: Deploy to Pages
        run: bunx wrangler pages deploy dist --project-name lockbox-web --commit-dirty=true
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Ensure vault domain is attached
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          endpoint="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/lockbox-web/domains/vault.authwell.app"
          response="$(mktemp)"
          status="$(curl --silent --show-error --output "$response" --write-out '%{http_code}' \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "$endpoint")"

          if [ "$status" = '200' ]; then
            exit 0
          fi
          if [ "$status" != '404' ]; then
            cat "$response"
            exit 1
          fi

          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            --header 'Content-Type: application/json' \
            --data '{"name":"vault.authwell.app"}' \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/lockbox-web/domains" \
            | jq -e '.success == true' >/dev/null

      - name: Ensure vault DNS record exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          zones="$(curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            'https://api.cloudflare.com/client/v4/zones?name=authwell.app&status=active')"
          zone_id="$(jq -er '.result | map(select(.name == "authwell.app")) | .[0].id' <<<"$zones")"
          dns_base="https://api.cloudflare.com/client/v4/zones/$zone_id/dns_records"
          records="$(curl --fail-with-body --silent --show-error --get \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            --data-urlencode 'type=CNAME' \
            --data-urlencode 'name=vault.authwell.app' \
            "$dns_base")"
          count="$(jq '.result | length' <<<"$records")"

          if [ "$count" = '1' ]; then
            jq -e '.result[0].content == "lockbox-web.pages.dev"' <<<"$records" >/dev/null || {
              echo 'Refusing to overwrite the existing vault.authwell.app DNS record.'
              exit 1
            }
            exit 0
          fi
          if [ "$count" != '0' ]; then
            echo "Expected at most one CNAME for vault.authwell.app; found $count."
            exit 1
          fi

          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            --header 'Content-Type: application/json' \
            --data '{"type":"CNAME","name":"vault.authwell.app","content":"lockbox-web.pages.dev","proxied":true}' \
            "$dns_base" \
            | jq -e '.success == true' >/dev/null
