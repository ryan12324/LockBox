name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint · Typecheck · Test · Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.10'

      - name: Cache Turbo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

      - name: Build Firefox extension
        run: bun run build:firefox
        working-directory: apps/extension

      # Upload build artifacts so they can be inspected on PRs
      - name: Upload Chrome extension
        uses: actions/upload-artifact@v4
        with:
          name: chrome-mv3-${{ github.sha }}
          path: apps/extension/.output/chrome-mv3/
          if-no-files-found: error
          retention-days: 7

      - name: Upload Firefox extension
        uses: actions/upload-artifact@v4
        with:
          name: firefox-mv2-${{ github.sha }}
          path: apps/extension/.output/firefox-mv2/
          if-no-files-found: error
          retention-days: 7

      - name: Upload web vault
        uses: actions/upload-artifact@v4
        with:
          name: web-dist-${{ github.sha }}
          path: apps/web/dist/
          if-no-files-found: error
          retention-days: 7

  android:
    name: Android Release Gate
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.10'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.1.0"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build web assets
        run: bun run build
        working-directory: apps/web

      - name: Sync Capacitor
        run: bun run build:android
        working-directory: apps/mobile

      - name: Compile debug APK and release bundle
        run: ./gradlew :app:assembleDebug :app:bundleRelease :app:lintRelease --no-daemon
        working-directory: apps/mobile/android

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-${{ github.sha }}
          path: apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload unsigned release AAB
        uses: actions/upload-artifact@v4
        with:
          name: android-release-unsigned-${{ github.sha }}
          path: apps/mobile/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 7

  ios:
    name: iOS Release Gate
    # Password-save and password-generation provider APIs require the iOS 26.2 SDK.
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.10'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify Xcode toolchain
        run: xcodebuild -version

      - name: Build and verify unsigned release archive
        run: bun run build:ios:release
        env:
          IOS_UNSIGNED: '1'
          IOS_ARCHIVE_PATH: ${{ runner.temp }}/Authwell.xcarchive

      - name: Upload unsigned iOS archive
        uses: actions/upload-artifact@v4
        with:
          name: ios-release-unsigned-${{ github.sha }}
          path: ${{ runner.temp }}/Authwell.xcarchive
          if-no-files-found: error
          retention-days: 7
